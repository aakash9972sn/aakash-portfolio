name: Portfolio command palette browser test
on:
  pull_request:
    branches: [main]
    paths:
      - "command-palette.js"
      - "command-palette.css"
      - "studio-extras.js"
      - "studio-light-theme.css"
      - "firebase-account.js"
      - "scripts/studio-light-auth-browser.mjs"
      - "scripts/command-palette-browser.mjs"
      - ".github/workflows/palette-browser.yml"
      - "**/*.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium --with-deps
      - run: node scripts/command-palette-browser.mjs
      - name: Test studio UI and Google sign-in with simulated Firebase
        run: node scripts/studio-light-auth-browser.mjs
      - name: Inspect live Firebase authorized domain (read-only, non-blocking)
        run: node scripts/check-firebase-domain.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-palette-browser
          path: |
            command-palette-browser.png
            studio-light-auth-browser.png
          retention-days: 1
