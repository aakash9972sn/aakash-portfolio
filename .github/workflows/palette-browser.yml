name: Portfolio command palette browser test
on:
  pull_request:
    branches: [main]
    paths:
      - "command-palette.js"
      - "command-palette.css"
      - "scripts/command-palette-browser.mjs"
      - ".github/workflows/palette-browser.yml"
      - "**/*.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium --with-deps
      - run: node scripts/command-palette-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-palette-browser
          path: command-palette-browser.png
          retention-days: 1
