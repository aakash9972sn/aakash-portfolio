<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Smart ID · separate entry and exit</title><desc id="desc">Proposed ESP32-S3 interface map — module configuration still requires hardware validation.</desc><rect width="1000" height="620" rx="16" fill="#101c27"/><style>text{font-family:Arial,sans-serif;fill:#e2eae9}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#a7bdc5}.label{font-size:18px;font-weight:700}.pin{font-size:16px;font-family:monospace}.small{font-size:14px;fill:#b7c9cc}</style><text x="40" y="50" class="title">Smart ID · separate entry and exit</text><text x="40" y="80" class="sub">Proposed ESP32-S3 interface map — module configuration still requires hardware validation.</text><rect x="335" y="120" width="330" height="360" rx="12" fill="#1c3449" stroke="#82a8c7"/><text x="406" y="165" class="title">ESP32-S3</text><text x="420" y="193" class="small">3.3 V GPIO logic</text><rect x="35" y="130" width="235" height="135" rx="8" fill="#243c35" stroke="#739788"/><text x="60" y="167" class="label">ENTRY · PN532</text><text x="60" y="199" class="pin">TX → GPIO16 (RX)</text><text x="60" y="225" class="pin">RX ← GPIO17 (TX)</text><text x="60" y="249" class="small">UART1 · reset GPIO4*</text><path d="M270 197h65" stroke="#a4d5bd" stroke-width="3"/><rect x="730" y="130" width="235" height="135" rx="8" fill="#243c35" stroke="#739788"/><text x="752" y="167" class="label">EXIT · PN532</text><text x="752" y="199" class="pin">TX → GPIO18 (RX)</text><text x="752" y="225" class="pin">RX ← GPIO21 (TX)</text><text x="752" y="249" class="small">UART2 · reset GPIO5*</text><path d="M665 197h65" stroke="#a4d5bd" stroke-width="3"/><rect x="35" y="340" width="235" height="135" rx="8" fill="#302e3d" stroke="#a99bbc"/><text x="60" y="377" class="label">DS3231 · RTC</text><text x="60" y="410" class="pin">SDA → GPIO8</text><text x="60" y="438" class="pin">SCL → GPIO9</text><text x="60" y="462" class="small">I²C · battery-backed time</text><path d="M270 405h65" stroke="#b9a6d3" stroke-width="3"/><rect x="730" y="340" width="235" height="135" rx="8" fill="#3b3528" stroke="#b9a16c"/><text x="752" y="377" class="label">microSD · SPI</text><text x="752" y="410" class="pin">SCK 12 · MOSI 11</text><text x="752" y="438" class="pin">MISO 13 · CS 10</text><text x="752" y="462" class="small">Append event → verify write</text><path d="M665 405h65" stroke="#e3c88e" stroke-width="3"/><text x="390" y="270" class="pin">UID → person lookup</text><text x="390" y="308" class="pin">reader → IN / OUT</text><text x="390" y="346" class="pin">RTC → timestamp</text><text x="390" y="384" class="pin">SD → event history</text><text x="390" y="440" class="small">Report completed sessions</text><text x="40" y="530" class="small">* Reset connections apply only when the chosen PN532 breakout exposes a compatible reset input.</text><text x="40" y="558" class="small">Set each reader to UART/HSU mode. Share ground and confirm module power, pull-ups and battery circuit.</text><text x="40" y="586" class="small">Functional connections only — verify the exact board revision and module ratings before assembly.</text></svg>