<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GATE EC practice test · Test Centre</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../theme-sync.js?v=20261121-t1"></script>
  <link rel="stylesheet" href="styles.css?v=gate-reader1">
  <link rel="stylesheet" href="gate-test.css?v=studio5">
  <script src="../ai-config.js"></script>
  <script src="hosted-ai.js"></script>
  <script defer src="../firebase-account.js"></script>
</head>
<body>
  <main class="runner gt-main">
    <header class="runner-head">
      <a class="btn btn-ghost" id="back-to-tests" href="./#/gate-papers">← GATE tests</a>
      <div class="runner-title"><h1 id="title">GATE EC practice test</h1></div>
      <div class="header-actions"><button type="button" data-theme-toggle class="btn btn-ghost"><span data-theme-label>Dark</span></button></div>
      <span class="runner-timer" id="timer"></span>
    </header>
    <p class="runner-note" id="status" role="status">Loading questions…</p>
    <section id="result" class="q-pane" aria-label="Test results" hidden>
      <h2>Attempt summary</h2><p id="score"></p><p id="marks"></p><p id="breakdown"></p>
      <button class="btn btn-primary" type="button" id="retake">Start a new attempt</button>
    </section>
    <div class="runner-body" id="workbench" hidden>
      <article class="q-pane gt-question">
        <h2 id="position" tabindex="-1"></h2>
        <p id="source"></p>
        <div id="question-content">
          <div id="prompt"></div>
          <fieldset id="answers"><legend>Your answer</legend><div class="options" id="controls"></div></fieldset>
        </div>
        <p id="marking"></p>
        <div class="q-actions">
          <button id="digitize" type="button" hidden>Transcribe with AI</button>
          <button id="explain" type="button" hidden>Explain with AI</button>
        </div>
        <p id="ai-note" role="status"></p>
        <p id="feedback" aria-live="polite"></p>
        <div class="q-actions"><button id="clear" type="button">Clear response</button><button id="flag" type="button" aria-pressed="false">Mark for review</button></div>
        <div class="q-nav-row"><button type="button" id="prev">← Previous</button><button type="button" class="q-next" id="next">Save &amp; Next</button></div>
      </article>
      <dialog class="palette" id="palette-panel" aria-labelledby="palette-title">
        <div class="palette-head"><h2 id="palette-title">Question palette</h2><button id="palette-close" type="button" aria-label="Close palette">×</button></div>
        <div class="palette-legend"><span><i class="lg-answered"></i>Answered</span><span><i class="lg-marked"></i>Marked</span><span><i class="lg-unseen"></i>Unanswered</span></div>
        <div class="palette-grid" id="palette" aria-label="Questions"></div>
        <div class="palette-footer">
          <p class="palette-summary" id="progress"></p>
          <button class="palette-submit" id="submit" type="button">Submit test</button>
        </div>
      </dialog>
      <button type="button" class="palette-fab" id="palette-open" aria-controls="palette-panel" aria-expanded="false">Question palette</button>
    </div>
    <dialog class="gt-dialog" id="confirm" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div class="modal-actions"><button class="btn btn-ghost" value="cancel" autofocus>Cancel</button><button class="btn btn-primary" value="yes" id="confirm-yes">Confirm</button></div></form></dialog>
    <dialog class="gt-dialog" id="image-viewer" aria-labelledby="image-title">
      <div class="gt-image-head"><h2 id="image-title">Question image</h2><button class="btn btn-ghost" id="image-fit" type="button">Fit to width</button><form method="dialog"><button class="btn btn-primary" autofocus>Close</button></form></div>
      <div id="image-scroll" tabindex="0" aria-label="Enlarged image"></div>
    </dialog>
  </main>
  <!-- MathJax SVG renders LaTeX as textbook equations in questions and solutions. -->
  <script>
    window.MathJax = {
      loader: { load: ['ui/safe'] },
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]'], ['$$', '$$']], processEscapes: true },
      svg: { fontCache: 'local' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      startup: {
        ready: function () {
          MathJax.startup.defaultReady();
          MathJax.startup.promise.then(function () {
            window.dispatchEvent(new Event('testcentre:math-ready'));
          });
        }
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
  <script src="math-render.js?v=20261124-math5"></script>
  <script src="syllabus-data.js"></script>
  <script src="test-core.js"></script>
  <script type="module" src="gate-test.js?v=csbulk2"></script>
</body>
</html>
