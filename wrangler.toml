# Optional Cloudflare Workers deployment; no key values are committed.
name = "aakash-portfolio-api"
main = "workers/api-worker.mjs"
compatibility_date = "2026-11-23"

[vars]
CORS_ORIGIN = "https://aakash9972sn.github.io"
GEMINI_MODEL_FAST = "gemini-2.5-flash-lite"
GEMINI_MODEL_DEEP = "gemini-2.5-pro"
ENABLE_MAPS_GROUNDING = "false"

# Set GEMINI_API_KEY using: npx wrangler secret put GEMINI_API_KEY
# Full PostgreSQL, authenticated scores and WS Live audio require the Node API.
