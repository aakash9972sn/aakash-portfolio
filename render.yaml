# Optional no-card Render Free deployment for the existing portfolio Node server.
# This file does NOT deploy anything or activate billing on its own.
# Enter GEMINI_API_KEY privately in Render. Never commit its value.
services:
  - type: web
    name: aakash-portfolio-gemini
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://aakash9972sn.github.io
      - key: GEMINI_MODEL_FAST
        value: gemini-2.5-flash-lite
      - key: AI_REQUESTS_PER_MINUTE
        value: '12'
      - key: GEMINI_API_KEY
        sync: false
